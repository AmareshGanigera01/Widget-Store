name: device_bridge
description: "Android integration for Widget Market: usage stats, focus monitor service, home screen widget, text capture intents."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.13.7
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.pranav.device_bridge
        pluginClass: DeviceBridgePlugin
